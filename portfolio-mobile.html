<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Portfolio Mobile</title>
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var target;

      if (isMobileDevice) {
        target = isDark ? 'portfolio-mobile-dark.html' : 'portfolio-mobile-light.html';
      } else {
        target = isDark ? 'projectsDark.html' : 'projects.html';
      }

      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=projects.html" />
  </noscript>
</head>
<body>
<script>
(function () {
    const logoSources = ['Logo 1.svg', 'Logo 2.svg', 'Logo 3.svg', 'Logo 4.svg', 'Logo 5.svg', 'Logo 6.svg'];
    const logos = document.querySelectorAll('.barcode-logo img');
    const intervalMs = 5000;
    const fadeOutMs = 220;
    const storageKey = 'logoCycleStartMs';

    if (!logos.length) {
        return;
    }

    let startMs;
    try {
        const stored = parseInt(localStorage.getItem(storageKey) || '', 10);
        if (Number.isNaN(stored)) {
            startMs = Date.now();
            localStorage.setItem(storageKey, String(startMs));
        } else {
            startMs = stored;
        }
    } catch (e) {
        startMs = Date.now();
    }

    function getCurrentIndex() {
        const elapsed = Date.now() - startMs;
        return Math.floor(elapsed / intervalMs) % logoSources.length;
    }

    logos.forEach(function (img) {
        img.width = 50;
        img.height = 50;
        img.style.width = '50px';
        img.style.height = '50px';
        img.style.objectFit = 'cover';
        img.style.transition = 'opacity 0.45s ease';
        img.style.opacity = '1';
        img.src = logoSources[getCurrentIndex()];

        const delayToNext = intervalMs - ((Date.now() - startMs) % intervalMs);

        setTimeout(function () {
            img.style.opacity = '0.35';
            setTimeout(function () {
                img.src = logoSources[getCurrentIndex()];
                img.style.opacity = '1';
            }, fadeOutMs);

            setInterval(function () {
                img.style.opacity = '0.35';
                setTimeout(function () {
                    img.src = logoSources[getCurrentIndex()];
                    img.style.opacity = '1';
                }, fadeOutMs);
            }, intervalMs);
        }, delayToNext);
    });
  </script>
  <script src="scripts/logo-rotator.js"></script>
</body>
</html>
