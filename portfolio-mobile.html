<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Portfolio Mobile</title>
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var target;

      if (isMobileDevice) {
        target = isDark ? 'portfolio-mobile-dark.html' : 'portfolio-mobile-light.html';
      } else {
        target = isDark ? 'projectsDark.html' : 'projects.html';
      }

      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=projects.html" />
  </noscript>
</head>
<body>
</body>
</html>
