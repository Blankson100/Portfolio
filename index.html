<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bright Blankson Portfolio</title>
  <script>
    // Detect dark mode preference
    var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    // Redirect to the appropriate mobile version
    if (isDark) {
      window.location.replace('portfolio-mobile-dark.html');
    } else {
      window.location.replace('portfolio-mobile-light.html');
    }
  </script>
  <style>
    body {
      background: #fff;
      color: #222;
      font-family: 'Jost', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading {
      font-size: 1.2em;
      color: #888;
    }
  </style>
<script>
  // Redirect to mobile version matching user's color scheme
  if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
    var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var target = isDark ? 'portfolio-mobile-dark.html' : 'portfolio-mobile-light.html';
    window.location.href = target;
  }
</script>
</head>
<body>
  <div class="loading">Loading portfolio...</div>
<script>
(function () {
    const logoSources = ['Logo 1.svg', 'Logo 2.svg', 'Logo 3.svg', 'Logo 4.svg', 'Logo 5.svg', 'Logo 6.svg'];
    const logos = document.querySelectorAll('.barcode-logo img');
    const intervalMs = 5000;
    const fadeOutMs = 220;
    const storageKey = 'logoCycleStartMs';

    if (!logos.length) {
        return;
    }

    let startMs;
    try {
        const stored = parseInt(localStorage.getItem(storageKey) || '', 10);
        if (Number.isNaN(stored)) {
            startMs = Date.now();
            localStorage.setItem(storageKey, String(startMs));
        } else {
            startMs = stored;
        }
    } catch (e) {
        startMs = Date.now();
    }

    function getCurrentIndex() {
        const elapsed = Date.now() - startMs;
        return Math.floor(elapsed / intervalMs) % logoSources.length;
    }

    logos.forEach(function (img) {
        img.width = 50;
        img.height = 50;
        img.style.width = '50px';
        img.style.height = '50px';
        img.style.objectFit = 'cover';
        img.style.transition = 'opacity 0.45s ease';
        img.style.opacity = '1';
        img.src = logoSources[getCurrentIndex()];

        const delayToNext = intervalMs - ((Date.now() - startMs) % intervalMs);

        setTimeout(function () {
            img.style.opacity = '0.35';
            setTimeout(function () {
                img.src = logoSources[getCurrentIndex()];
                img.style.opacity = '1';
            }, fadeOutMs);

            setInterval(function () {
                img.style.opacity = '0.35';
                setTimeout(function () {
                    img.src = logoSources[getCurrentIndex()];
                    img.style.opacity = '1';
                }, fadeOutMs);
            }, intervalMs);
        }, delayToNext);
    });
  </script>
  <script src="scripts/logo-rotator.js"></script>
</body>
</html>
