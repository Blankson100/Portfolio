<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 1450" width="1085" height="1450">
<defs><filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter><clipPath id="moonOuter"><circle cx="185" cy="705" r="62"/></clipPath><mask id="moonCut"><rect width="1085" height="1450" fill="#fff"/><circle cx="216" cy="688" r="50" fill="#000"/></mask></defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}15%,85%{opacity:1}100%{transform:translateY(80px) rotate(140deg);opacity:0}}
@keyframes flutter{0%{transform:translateY(-18px) rotate(0);opacity:0}20%,80%{opacity:1}100%{transform:translateY(34px) rotate(200deg);opacity:0}}
@keyframes rise{0%{transform:translateY(24px) scale(.8);opacity:0}25%,80%{opacity:1}100%{transform:translateY(-46px) scale(1.1);opacity:0}}
@keyframes rain{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}100%{transform:translateY(110px);opacity:0}}
@keyframes drift{0%{transform:translateX(-24px);opacity:0}30%,70%{opacity:.8}100%{transform:translateX(36px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave{0%,100%{transform:skewY(-5deg)}50%{transform:skewY(4deg) scaleX(.95)}}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes toot{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
@keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="358" y="584" width="112" height="56" rx="22" fill="#B77B59"/><rect x="572" y="562" width="126" height="60" rx="24" fill="#B77B59"/>
<g filter="url(#rough)" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<path d="M366,610 Q414,642 464,608 M390,622 L384,636 M414,626 L414,641 M439,621 L445,635" fill="none" stroke-width="10"/>
<path d="M579,590 Q636,622 692,588 M607,602 L601,616 M636,606 L636,621 M664,601 L670,615" fill="none" stroke-width="10"/>
<g style="animation:bob 4s ease-in-out infinite">
<g mask="url(#moonCut)"><circle cx="185" cy="705" r="58" fill="#FFE066"/></g>
<circle cx="216" cy="688" r="50" fill="none" clip-path="url(#moonOuter)"/>
</g>
<g class="a" style="animation:twinkle 2.1s ease-in-out 0s infinite"><path d="M235,552 L239.2,562.2 L250.2,563.1 L241.8,570.2 L244.4,580.9 L235,575.2 L225.6,580.9 L228.2,570.2 L219.8,563.1 L230.8,562.2 Z" fill="#FFE066" stroke-width="7"/></g><g class="a" style="animation:twinkle 2.1s ease-in-out -0.7s infinite"><path d="M132,821 L135.7,829.9 L145.3,830.7 L138,836.9 L140.2,846.3 L132,841.3 L123.8,846.3 L126,836.9 L118.7,830.7 L128.3,829.9 Z" fill="#FFE066" stroke-width="7"/></g><g class="a" style="animation:twinkle 2.1s ease-in-out -1.4s infinite"><path d="M252,890 L256,899.5 L266.3,900.4 L258.4,907.1 L260.8,917.1 L252,911.8 L243.2,917.1 L245.6,907.1 L237.7,900.4 L248,899.5 Z" fill="#FFE066" stroke-width="7"/></g>
</g>

</svg>
