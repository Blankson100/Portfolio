<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 1450" width="1085" height="1450">
<defs><filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}15%,85%{opacity:1}100%{transform:translateY(80px) rotate(140deg);opacity:0}}
@keyframes flutter{0%{transform:translateY(-18px) rotate(0);opacity:0}20%,80%{opacity:1}100%{transform:translateY(34px) rotate(200deg);opacity:0}}
@keyframes rise{0%{transform:translateY(24px) scale(.8);opacity:0}25%,80%{opacity:1}100%{transform:translateY(-46px) scale(1.1);opacity:0}}
@keyframes rain{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}100%{transform:translateY(110px);opacity:0}}
@keyframes drift{0%{transform:translateX(-24px);opacity:0}30%,70%{opacity:.8}100%{transform:translateX(36px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave{0%,100%{transform:skewY(-5deg)}50%{transform:skewY(4deg) scaleX(.95)}}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes toot{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
@keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<ellipse cx="345" cy="742" rx="46" ry="24" fill="#F06292" fill-opacity=".5"/><ellipse cx="724" cy="736" rx="40" ry="22" fill="#F06292" fill-opacity=".5"/>
<g filter="url(#rough)" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<g class="a" style="animation:rise 3.6s ease-in-out 0s infinite"><path d="M200,479.5 C112,424.5 161.5,364 200,405.3 C238.5,364 288,424.5 200,479.5 Z" fill="#E63946"/></g><g class="a" style="animation:rise 3.6s ease-in-out -0.9s infinite"><path d="M880,465.5 C808,420.5 848.5,371 880,404.8 C911.5,371 952,420.5 880,465.5 Z" fill="#FF4FA3"/></g><g class="a" style="animation:rise 3.6s ease-in-out -1.8s infinite"><path d="M165,754.2 C104.2,716.2 138.4,674.4 165,702.9 C191.6,674.4 225.8,716.2 165,754.2 Z" fill="#FF4FA3"/></g><g class="a" style="animation:rise 3.6s ease-in-out -2.6s infinite"><path d="M905,736 C841,696 877,652 905,682 C933,652 969,696 905,736 Z" fill="#E63946"/></g><g class="a" style="animation:rise 3.6s ease-in-out -1.3s infinite"><path d="M300,327 C252,297 279,264 300,286.5 C321,264 348,297 300,327 Z" fill="#E63946"/></g>
</g>

</svg>
