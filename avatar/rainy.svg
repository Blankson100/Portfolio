<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 1450" width="1085" height="1450">
<defs><filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>
.a{transform-box:fill-box;transform-origin:center}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}15%,85%{opacity:1}100%{transform:translateY(80px) rotate(140deg);opacity:0}}
@keyframes flutter{0%{transform:translateY(-18px) rotate(0);opacity:0}20%,80%{opacity:1}100%{transform:translateY(34px) rotate(200deg);opacity:0}}
@keyframes rise{0%{transform:translateY(24px) scale(.8);opacity:0}25%,80%{opacity:1}100%{transform:translateY(-46px) scale(1.1);opacity:0}}
@keyframes rain{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}100%{transform:translateY(110px);opacity:0}}
@keyframes drift{0%{transform:translateX(-24px);opacity:0}30%,70%{opacity:.8}100%{transform:translateX(36px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wave{0%,100%{transform:skewY(-5deg)}50%{transform:skewY(4deg) scaleX(.95)}}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes toot{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
@keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g filter="url(#rough)" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<path d="M260,385 C280,250 400,215 545,215 C690,215 810,250 830,385 Q759,345 688,385 Q616,345 545,385 Q474,345 402,385 Q331,345 260,385 Z" fill="#3BA7F0"/>
<path d="M545,215 L402,385 Q474,345 545,385 Z" fill="#FFD23F" stroke-width="6"/>
<path d="M545,215 C690,215 810,250 830,385 Q759,345 688,385 Z" fill="#FFD23F" stroke-width="6"/>
<path d="M545,215 L402,385 M545,215 L545,385 M545,215 L688,385 M545,215 L545,196" fill="none" stroke-width="7"/>
<g class="a" style="animation:rain 1.1s linear -0.00s infinite"><path d="M170,446 C185,466 185,484 170,484 C155,484 155,466 170,446 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.37s infinite"><path d="M232,576 C247,596 247,614 232,614 C217,614 217,596 232,576 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.74s infinite"><path d="M140,666 C155,686 155,704 140,704 C125,704 125,686 140,666 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.01s infinite"><path d="M215,776 C230,796 230,814 215,814 C200,814 200,796 215,776 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.38s infinite"><path d="M152,881 C167,901 167,919 152,919 C137,919 137,901 152,881 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.75s infinite"><path d="M255,446 C270,466 270,484 255,484 C240,484 240,466 255,446 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.02s infinite"><path d="M195,616 C210,636 210,654 195,654 C180,654 180,636 195,616 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.39s infinite"><path d="M880,446 C895,466 895,484 880,484 C865,484 865,466 880,446 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.76s infinite"><path d="M930,576 C945,596 945,614 930,614 C915,614 915,596 930,576 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.03s infinite"><path d="M860,676 C875,696 875,714 860,714 C845,714 845,696 860,676 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.40s infinite"><path d="M925,776 C940,796 940,814 925,814 C910,814 910,796 925,776 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.77s infinite"><path d="M872,881 C887,901 887,919 872,919 C857,919 857,901 872,881 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.04s infinite"><path d="M830,536 C845,556 845,574 830,574 C815,574 815,556 830,536 Z" fill="#5DADE2" stroke-width="6"/></g><g class="a" style="animation:rain 1.1s linear -0.41s infinite"><path d="M950,426 C965,446 965,464 950,464 C935,464 935,446 950,426 Z" fill="#5DADE2" stroke-width="6"/></g>
</g>

</svg>
