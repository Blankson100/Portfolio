    <script>
        // --- Detect referrer and set active nav ---
        (function() {
            const params = new URLSearchParams(window.location.search);
            const from = params.get('from');
            if (from === 'home') {
                document.getElementById('nav-home').classList.add('nav-item-active');
            } else if (from === 'projects') {
                document.getElementById('nav-projects').classList.add('nav-item-active');
            } else {
                const referrer = document.referrer.toLowerCase();
                if (referrer.includes('bb.html') || referrer.includes('bbdark.html')) {
                    document.getElementById('nav-home').classList.add('nav-item-active');
                } else {
                    document.getElementById('nav-projects').classList.add('nav-item-active');
                }
            }
        })();

        // --- Click sound effect ---
        const clickAudioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            const now = clickAudioContext.currentTime;
            const duration = 0.09;

            if (clickAudioContext.state === 'suspended') {
                clickAudioContext.resume();
            }

            const osc = clickAudioContext.createOscillator();
            const gain = clickAudioContext.createGain();

            osc.connect(gain);
            gain.connect(clickAudioContext.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(560, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + duration);

            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.start(now);
            osc.stop(now + duration);
        }

        document.addEventListener('pointerdown', function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('button') || e.target.closest('a')) {
                playClickSound();
            }
        }, { capture: true });



        function updateTime() {
            // The time in Accra, whatever the visitor's own time zone is.
            const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Accra', hour: 'numeric', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
            const hour = parseInt(parts.find(p => p.type === 'hour').value, 10), minute = parts.find(p => p.type === 'minute').value;
            document.getElementById('time-location').innerHTML = String(hour % 12 || 12).padStart(2, '0') + ':' + minute + ' ' + (hour >= 12 ? 'pm' : 'am') + ' in Accra, Ghana';
        }
        
        updateTime();
        setInterval(updateTime, 60000);

        // --- Restore scroll position from mode switch ---
        (function() {
            const params = new URLSearchParams(window.location.search);
            const scrollY = params.get('scrollY');
            if (scrollY) {
                window.scrollTo(0, parseInt(scrollY, 10));
            }
        })();

        // --- Smart back navigation ---
        function smartBack() {
            const params = new URLSearchParams(window.location.search);
            const from = params.get('from');
            if (from === 'home') {
                window.location.href = 'BBDark.html';
            } else {
                window.location.href = 'projectsDark.html';
            }
        }

        const modeButtons = document.querySelectorAll('.mode-btn');
        
        modeButtons.forEach((btn, index) => {
            btn.addEventListener('click', function() {
                playClickSound();
                modeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const fromParam = new URLSearchParams(window.location.search).get('from') || 'projects';
                const scrollY = window.scrollY || document.documentElement.scrollTop;
                setTimeout(() => {
                    if(index === 0) {
                        window.location.href = 'clostraDark.html?from=' + fromParam + '&scrollY=' + scrollY;
                    } else if(index === 1) {
                        window.location.href = 'clostra.html?from=' + fromParam + '&scrollY=' + scrollY;
                    }
                }, 100);
            });
        });


    </script>
<script>
(function () {
    const logoSources = ['Logo 1.svg', 'Logo 2.svg', 'Logo 3.svg', 'Logo 4.svg', 'Logo 5.svg', 'Logo 6.svg'];
    const logos = document.querySelectorAll('.barcode-logo img');
    const intervalMs = 5000;
    const fadeOutMs = 220;
    const storageKey = 'logoCycleStartMs';

    if (!logos.length) {
        return;
    }

    let startMs;
    try {
        const stored = parseInt(localStorage.getItem(storageKey) || '', 10);
        if (Number.isNaN(stored)) {
            startMs = Date.now();
            localStorage.setItem(storageKey, String(startMs));
        } else {
            startMs = stored;
        }
    } catch (e) {
        startMs = Date.now();
    }

    function getCurrentIndex() {
        const elapsed = Date.now() - startMs;
        return Math.floor(elapsed / intervalMs) % logoSources.length;
    }

    logos.forEach(function (img) {
        img.width = 50;
        img.height = 50;
        img.style.width = '50px';
        img.style.height = '50px';
        img.style.objectFit = 'cover';
        img.style.transition = 'opacity 0.45s ease';
        img.style.opacity = '1';
        img.src = logoSources[getCurrentIndex()];

        const delayToNext = intervalMs - ((Date.now() - startMs) % intervalMs);

        setTimeout(function () {
            img.style.opacity = '0.35';
            setTimeout(function () {
                img.src = logoSources[getCurrentIndex()];
                img.style.opacity = '1';
            }, fadeOutMs);

            setInterval(function () {
                img.style.opacity = '0.35';
                setTimeout(function () {
                    img.src = logoSources[getCurrentIndex()];
                    img.style.opacity = '1';
                }, fadeOutMs);
            }, intervalMs);
        }, delayToNext);
    });
})();
</script>
<script>
    (function() {
        const sections = document.querySelectorAll('.toc-section');
        const navLinks = document.querySelectorAll('.project-sidebar a[href^="#"]');
        if (!sections.length || !navLinks.length) {
            return;
        }

        function onScroll() {
            const triggerLine = 150;
            let currentId = null;

            sections.forEach(function(section) {
                if (section.getBoundingClientRect().top <= triggerLine) {
                    currentId = section.id;
                }
            });

            const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
            if (atBottom) {
                currentId = sections[sections.length - 1].id;
            }

            navLinks.forEach(function(link) {
                link.classList.toggle('active', link.getAttribute('href') === '#' + currentId);
            });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('pageshow', onScroll);
        onScroll();

        navLinks.forEach(function(link) {
            link.addEventListener('mouseenter', function() {
                const target = document.querySelector(link.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    })();
</script>
