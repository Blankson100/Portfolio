    <script>
        // --- Detect referrer and set active nav ---
        (function() {
            const params = new URLSearchParams(window.location.search);
            const from = params.get('from');
            if (from === 'home') {
                document.getElementById('nav-home').classList.add('nav-item-active');
            } else if (from === 'projects') {
                document.getElementById('nav-projects').classList.add('nav-item-active');
            } else {
                const referrer = document.referrer.toLowerCase();
                if (referrer.includes('bb.html') || referrer.includes('bbdark.html')) {
                    document.getElementById('nav-home').classList.add('nav-item-active');
                } else {
                    document.getElementById('nav-projects').classList.add('nav-item-active');
                }
            }
        })();

        // --- Click sound effect ---
        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioContext.currentTime;
            const duration = 0.5;
            
            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            const osc3 = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc1.connect(gain);
            osc2.connect(gain);
            osc3.connect(gain);
            gain.connect(audioContext.destination);
            
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(800, now);
            
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1200, now);
            
            osc3.type = 'sine';
            osc3.frequency.setValueAtTime(1600, now);
            
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            osc1.start(now);
            osc2.start(now);
            osc3.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);
            osc3.stop(now + duration);
        }
        
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('button') || e.target.closest('a')) {
                playClickSound();
            }
        });

        function updateTime() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            const day = days[now.getDay()];
            const date = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear().toString().slice(-2);
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');
            
            const timeString = `${hoursStr}:${minutes} ${ampm} ${day} ${date} ${month} ${year}`;
            const locationString = `Accra,Ghana.`;
            
            document.getElementById('time-location').innerHTML = `${timeString}<br>${locationString}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);

        // --- Restore scroll position from mode switch ---
        (function() {
            const params = new URLSearchParams(window.location.search);
            const scrollY = params.get('scrollY');
            if (scrollY) {
                window.scrollTo(0, parseInt(scrollY, 10));
            }
        })();

        // --- Smart back navigation ---
        function smartBack() {
            const params = new URLSearchParams(window.location.search);
            const from = params.get('from');
            if (from === 'home') {
                window.location.href = 'BB.html';
            } else {
                window.location.href = 'projects.html';
            }
        }

        const modeButtons = document.querySelectorAll('.mode-btn');
        
        modeButtons.forEach((btn, index) => {
            btn.addEventListener('click', function() {
                playClickSound();
                modeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const fromParam = new URLSearchParams(window.location.search).get('from') || 'projects';
                const scrollY = window.scrollY || document.documentElement.scrollTop;
                setTimeout(() => {
                    if(index === 0) {
                        window.location.href = 'clostraDark.html?from=' + fromParam + '&scrollY=' + scrollY;
                    } else if(index === 1) {
                        window.location.href = 'clostra.html?from=' + fromParam + '&scrollY=' + scrollY;
                    }
                }, 100);
            });
        });

        // Details slide controls with instant number updates
        (function() {
            const slideImage = document.getElementById('details-slide-image');
            const prevBtn = document.getElementById('details-prev-slide');
            const nextBtn = document.getElementById('details-next-slide');
            const numberCircle = document.getElementById('details-slide-number-circle');

            if (!slideImage || !prevBtn || !nextBtn || !numberCircle) {
                return;
            }

            const slides = [
                'ClostraEscrow.png',
                'Frame 360.svg',
                'Frame 362.svg',
                'Frame 359.svg'
            ];

            let currentIndex = 0;
            const slideParam = new URLSearchParams(window.location.search).get('slide');
            const parsedSlide = parseInt(slideParam, 10);
            if (!Number.isNaN(parsedSlide)) {
                currentIndex = Math.min(Math.max(parsedSlide, 0), slides.length - 1);
            }

            function getNumberValue(index) {
                return String(index + 1).padStart(2, '0');
            }

            function buildOneMarkup(value) {
                return '<span class="digit-one">' + value + '</span>';
            }

            function buildNumberMarkup(index) {
                const value = String(index + 1).padStart(2, '0');
                return '<span class="details-number"><span class="digit-zero">' + value.charAt(0) + '</span><span class="digit-one-slot"><span class="digit-one">' + value.charAt(1) + '</span></span></span>';
            }

            function updateNumber(index) {
                const value = getNumberValue(index);
                const zeroEl = numberCircle.querySelector('.digit-zero');
                const oneSlot = numberCircle.querySelector('.digit-one-slot');

                if (!zeroEl || !oneSlot) {
                    numberCircle.innerHTML = buildNumberMarkup(index);
                    return;
                }

                zeroEl.textContent = value.charAt(0);
                oneSlot.innerHTML = buildOneMarkup(value.charAt(1));
            }

            function updateArrowState() {
                prevBtn.classList.toggle('is-disabled', currentIndex === 0);
                nextBtn.classList.toggle('is-disabled', currentIndex === slides.length - 1);
            }

            function syncSlideUI() {
                slideImage.src = slides[currentIndex];
                slideImage.alt = 'Clostra Slide ' + String(currentIndex + 1).padStart(2, '0');
                updateNumber(currentIndex);
                updateArrowState();
                window.clostraCurrentSlideIndex = currentIndex;
            }

            function goTo(direction) {
                if (slides.length <= 1) {
                    return;
                }
                const nextIndex = currentIndex + direction;
                if (nextIndex < 0 || nextIndex >= slides.length) {
                    return;
                }
                currentIndex = nextIndex;
                syncSlideUI();
            }

            function handleSliderKeydown(event) {
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
                    return;
                }
                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    goTo(-1);
                } else if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    goTo(1);
                }
            }

            syncSlideUI();
            prevBtn.addEventListener('click', function() { goTo(-1); });
            nextBtn.addEventListener('click', function() { goTo(1); });
            document.addEventListener('keydown', handleSliderKeydown);
        })();
    </script>
</body>
</html>
