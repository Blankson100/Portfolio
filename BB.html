        }

<body>

        <div class="introduction">
            <div class="intro-inner">
                <p class="intro-sub">People first design, across products, systems and wherever AI shows up.</p>
                <div class="extra-action">

                        <div class="featured-content-box">

                                <a href="leafai.html?from=home" class="leafAi" data-project="Plant AI" style="text-decoration: none;">

                    </div>

            </div>
        </div>
        <footer class="footer">
            <p>© 2025 • Nyame Dua Inc • the body is finally at rest.</p>
            <div class="footer-icons">
                    <img src="XWHITE.svg" alt="X" width="24" height="24">
                    <img src="LinkedIN WHITE.svg" alt="LinkedIn" width="24" height="24">
            </div>
        </footer>
    </div>
    <div class="cursor-tooltip" id="cursorTooltip"></div>
    <script>
        // --- Cursor tooltip for project cards ---
        (function() {
            const tooltip = document.getElementById('cursorTooltip');
            const projectItems = document.querySelectorAll('[data-project]');

            projectItems.forEach(item => {
                item.addEventListener('mouseenter', function() {
                    tooltip.textContent = this.dataset.project;
                    tooltip.classList.add('visible');
                });
                item.addEventListener('mouseleave', function() {
                    tooltip.classList.remove('visible');
                });
                item.addEventListener('mousemove', function(e) {
                    tooltip.style.left = e.clientX + 14 + 'px';
                    tooltip.style.top = e.clientY + 14 + 'px';
                });
            });
        })();

        // --- Click sound effect ---
        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioContext.currentTime;
            const duration = 0.5;
            
            // Create a bell notification sound with multiple harmonics
            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            const osc3 = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc1.connect(gain);
            osc2.connect(gain);
            osc3.connect(gain);
            gain.connect(audioContext.destination);
            
            // Main frequency (bright bell tone)
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(800, now);
            
            // Second harmonic
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1200, now);
            
            // Third harmonic for richness
            osc3.type = 'sine';
            osc3.frequency.setValueAtTime(1600, now);
            
            // Volume envelope - quick attack, long decay
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            osc1.start(now);
            osc2.start(now);
            osc3.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);
            osc3.stop(now + duration);
        }
        
        // Add click sound to all buttons
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('button') || e.target.closest('a')) {
                playClickSound();
            }
        });

        function updateTime() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            const day = days[now.getDay()];
            const date = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear().toString().slice(-2);
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');
            
            const timeString = `${hoursStr}:${minutes} ${ampm} ${day} ${date} ${month} ${year}`;
            const locationString = `Accra,Ghana.`;
            
            document.getElementById('time-location').innerHTML = `${timeString}<br>${locationString}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);

        // --- Restore scroll position from mode switch ---
        (function() {
            const params = new URLSearchParams(window.location.search);
            const scrollY = params.get('scrollY');
            if (scrollY) {
                window.scrollTo(0, parseInt(scrollY, 10));
            }
        })();

        // Mode switching
        const modeButtons = document.querySelectorAll('.mode-btn');
        
        modeButtons[1].classList.add('active'); // Light mode active
        
        modeButtons.forEach((btn, index) => {
            btn.addEventListener('click', function() {
                playClickSound();
                modeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const scrollY = window.scrollY || document.documentElement.scrollTop;
                setTimeout(() => {
                    if(index === 0) {
                        window.location.href = 'BBDark.html?scrollY=' + scrollY;
                    } else if(index === 1) {
                        window.location.href = 'BB.html?scrollY=' + scrollY;
                    }
                }, 100);
            });
        });
    </script>
</body>
