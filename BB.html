    <script>
        // --- Cursor tooltip for project cards ---
        (function() {
            const tooltip = document.getElementById('cursorTooltip');
            const projectItems = document.querySelectorAll('[data-project]');

            projectItems.forEach(item => {
                item.addEventListener('mouseenter', function() {
                    tooltip.textContent = this.dataset.project;
                    tooltip.classList.add('visible');
                });
                item.addEventListener('mouseleave', function() {
                    tooltip.classList.remove('visible');
                });
                item.addEventListener('mousemove', function(e) {
                    tooltip.style.left = e.clientX + 14 + 'px';
                    tooltip.style.top = e.clientY + 14 + 'px';
                });
            });
        })();

        // --- Click sound effect ---
        const clickAudioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            const now = clickAudioContext.currentTime;
            const duration = 0.09;

            if (clickAudioContext.state === 'suspended') {
                clickAudioContext.resume();
            }

            const osc = clickAudioContext.createOscillator();
            const gain = clickAudioContext.createGain();

            osc.connect(gain);
            gain.connect(clickAudioContext.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(560, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + duration);

            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            osc.start(now);
            osc.stop(now + duration);
        }

        document.addEventListener('pointerdown', function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.closest('button') || e.target.closest('a')) {
                playClickSound();
            }
        }, { capture: true });



        function updateTime() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            const day = days[now.getDay()];
            const date = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear().toString().slice(-2);
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');
            
            const timeString = `${hoursStr}:${minutes} ${ampm} ${day} ${date} ${month} ${year}`;
            const locationString = `Accra,Ghana.`;
            
            document.getElementById('time-location').innerHTML = `${timeString}<br>${locationString}`;
        }
        
        updateTime();
        setInterval(updateTime, 60000);

        // --- Restore scroll position from mode switch ---
        (function() {
            const params = new URLSearchParams(window.location.search);
            const scrollY = params.get('scrollY');
            if (scrollY) {
                window.scrollTo(0, parseInt(scrollY, 10));
            }
        })();

        // Mode switching
        const modeButtons = document.querySelectorAll('.mode-btn');
        
        modeButtons[1].classList.add('active'); // Light mode active
        
        modeButtons.forEach((btn, index) => {
            btn.addEventListener('click', function() {
                playClickSound();
                modeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const scrollY = window.scrollY || document.documentElement.scrollTop;
                setTimeout(() => {
                    if(index === 0) {
                        window.location.href = 'BBDark.html?scrollY=' + scrollY;
                    } else if(index === 1) {
                        window.location.href = 'BB.html?scrollY=' + scrollY;
                    }
                }, 100);
            });
        });
    </script>
<script>
(function () {
    const logoSources = ['Logo 1.svg', 'Logo 2.svg', 'Logo 3.svg', 'Logo 4.svg', 'Logo 5.svg', 'Logo 6.svg'];
    const logos = document.querySelectorAll('.barcode-logo img');
    const intervalMs = 5000;
    const fadeOutMs = 220;
    const storageKey = 'logoCycleStartMs';

    if (!logos.length) {
        return;
    }

    let startMs;
    try {
        const stored = parseInt(localStorage.getItem(storageKey) || '', 10);
        if (Number.isNaN(stored)) {
            startMs = Date.now();
            localStorage.setItem(storageKey, String(startMs));
        } else {
            startMs = stored;
        }
    } catch (e) {
        startMs = Date.now();
    }

    function getCurrentIndex() {
        const elapsed = Date.now() - startMs;
        return Math.floor(elapsed / intervalMs) % logoSources.length;
    }

    logos.forEach(function (img) {
        img.width = 50;
        img.height = 50;
        img.style.width = '50px';
        img.style.height = '50px';
        img.style.objectFit = 'cover';
        img.style.transition = 'opacity 0.45s ease';
        img.style.opacity = '1';
        img.src = logoSources[getCurrentIndex()];

        const delayToNext = intervalMs - ((Date.now() - startMs) % intervalMs);

        setTimeout(function () {
            img.style.opacity = '0.35';
            setTimeout(function () {
                img.src = logoSources[getCurrentIndex()];
                img.style.opacity = '1';
            }, fadeOutMs);

            setInterval(function () {
                img.style.opacity = '0.35';
                setTimeout(function () {
                    img.src = logoSources[getCurrentIndex()];
                    img.style.opacity = '1';
                }, fadeOutMs);
            }, intervalMs);
        }, delayToNext);
    });
    </script>
